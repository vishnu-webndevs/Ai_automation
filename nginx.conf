# Redirect www.totan.ai to https://totan.ai
server {
    listen 80;
    listen 443;
    server_name www.totan.ai;
    return 301 https://totan.ai$request_uri;
}

server {
    listen 3000;
    server_name localhost totan.ai;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
